---
name: Build container image
on:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - beta
    paths-ignore:
      - '**/README.md'
      - 'AGENTS.md'
      - 'assets/**'
      - 'installer/**'
      - 'disk_config/**'
      - 'Justfile'
      - '.github/workflows/build-disk.yml'
  workflow_dispatch:

env:
  IMAGE_DESC: "Aerinite: a minimal niri + Noctalia desktop on Universal Blue base-main"
  IMAGE_NAME: "${{ github.event.repository.name || 'aerinite' }}"  # output image name, usually same as repo name
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  # The beta branch publishes to its own channel: tag "beta" and beta-* build
  # tags, prerelease releases, and never touches latest or the Fedora major tag.
  CHANNEL: ${{ github.ref_name == 'beta' && 'beta' || 'stable' }}
  DEFAULT_TAG: ${{ github.ref_name == 'beta' && 'beta' || 'latest' }}
  TAG_PREFIX: ${{ github.ref_name == 'beta' && 'beta-' || '' }}
  # Forks without a SIGNING_SECRET publish unsigned; tedohayer/aerinite fails
  HAS_SIGNING_KEY: ${{ secrets.SIGNING_SECRET != '' }}

# One build per branch at a time, whatever triggered it: concurrent builds
# would race on the build tag and on latest. Only PR runs are cancelled;
# main and beta builds queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-base:
    name: Check if base image changed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      base_image: ${{ steps.base.outputs.image }}
      base_digest: ${{ steps.base.outputs.digest }}
      base_kernel: ${{ steps.base.outputs.kernel }}
      base_version: ${{ steps.base.outputs.version }}
      base_missing: ${{ steps.base.outputs.missing }}
      fedora_major: ${{ steps.base.outputs.fedora_major }}
      should_build: ${{ steps.compare.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # BASE_IMAGE in the Containerfile is the single source of truth; the
      # Fedora major comes from the base image's own version label.
      - name: Get current base image metadata
        id: base
        run: |
          BASE_IMAGE=$(sed -n 's/^ARG BASE_IMAGE=//p' Containerfile)
          [ -n "${BASE_IMAGE}" ] || { echo "BASE_IMAGE not found in Containerfile"; exit 1; }
          if ! skopeo inspect "docker://${BASE_IMAGE}" > base.json; then
            # Beta may target a base that isn't published yet: skip, don't fail
            if [ "${CHANNEL}" = beta ]; then
              echo "::notice::${BASE_IMAGE} is not published yet; skipping the beta build"
              echo "missing=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Could not inspect ${BASE_IMAGE}"; exit 1
          fi
          DIGEST=$(jq -r '.Digest' base.json)
          KERNEL=$(jq -r '.Labels["ostree.linux"] // ""' base.json)
          VERSION=$(jq -r '.Labels["org.opencontainers.image.version"] // ""' base.json)
          MAJOR=${VERSION%%.*}
          if ! [[ "${MAJOR}" =~ ^[0-9]+$ ]]; then
            MAJOR=$(grep -oP '\.fc\K[0-9]+' <<< "${KERNEL}" || true)
          fi
          [[ "${MAJOR}" =~ ^[0-9]+$ ]] || { echo "Could not determine Fedora version of ${BASE_IMAGE}"; exit 1; }
          echo "Base ${BASE_IMAGE}: version ${VERSION}, kernel ${KERNEL}, Fedora ${MAJOR}"
          {
            echo "image=${BASE_IMAGE}"
            echo "digest=${DIGEST}"
            echo "kernel=${KERNEL}"
            echo "version=${VERSION}"
            echo "fedora_major=${MAJOR}"
          } >> "$GITHUB_OUTPUT"

      - name: Compare with last built image
        id: compare
        run: |
          if [ "${{ steps.base.outputs.missing }}" = true ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event is ${{ github.event_name }}, building"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Sunday weekly build: date -u +%u returns 1 (Mon) through 7 (Sun)
          DOW=$(date -u +%u)
          if [ "${DOW}" -eq 7 ]; then
            echo "Scheduled run on Sunday: forcing weekly build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Rebuild whenever base-main changed at all (not just its kernel), by
          # comparing its digest with the base digest recorded on our latest.
          REPO_NAME="${IMAGE_NAME:-${GITHUB_REPOSITORY#*/}}"
          IMAGE_REF="docker://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${REPO_NAME,,}:${DEFAULT_TAG}"

          PREV_BASE=$(skopeo inspect --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" "${IMAGE_REF}" \
            --format '{{index .Labels "org.opencontainers.image.base.digest"}}' || echo "")
          [ "${PREV_BASE}" = "<no value>" ] && PREV_BASE=""
          BASE="${{ steps.base.outputs.digest }}"

          echo "Current base digest:      '${BASE}'"
          echo "Base of our latest image: '${PREV_BASE}'"

          if [ -z "${PREV_BASE}" ] || [ "${PREV_BASE}" = unknown ]; then
            echo "No recorded base digest, building"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${BASE}" != "${PREV_BASE}" ]; then
            echo "Base image updated, building"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Base image unchanged, skipping until Sunday or the next base update"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04
    needs: check-base
    if: needs.check-base.outputs.should_build == 'true'

    permissions:
      contents: write  # GitHub releases
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # Forks without the key publish unsigned; Aerinite itself must never.
      - name: Check signing key
        if: github.event_name != 'pull_request' && env.HAS_SIGNING_KEY != 'true'
        run: |
          if [ "${GITHUB_REPOSITORY}" = tedohayer/aerinite ]; then
            echo "::error::SIGNING_SECRET is missing; refusing to publish unsigned images"
            exit 1
          fi
          echo "::warning::No SIGNING_SECRET; publishing unsigned images"

      # Actions are pinned to commit SHAs; Dependabot proposes updates
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # history and tags for release notes

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      # Universal Blue style versions: tag 45-20261008, then 45-20261008.1, .2…
      # for later builds that day; the version label uses dots (45.20261008.1).
      # Beta build tags carry a prefix (beta-45-20261010) so they never collide.
      - name: Compute version
        id: version
        env:
          MAJOR: ${{ needs.check-base.outputs.fedora_major }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d)
          # A failed listing must fail the build, not read as "no tags today"
          # and overwrite today's tag.
          TAGS=$(skopeo list-tags --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}" | jq -r '.Tags[]')
          EXISTING=$(grep -E "^${TAG_PREFIX}${MAJOR}-${DATE}(\.[0-9]+)?$" <<< "${TAGS}" || true)
          if [ -z "${EXISTING}" ]; then
            TAG="${TAG_PREFIX}${MAJOR}-${DATE}"
            VERSION="${MAJOR}.${DATE}"
          else
            LAST=$(sed -E "s/^${TAG_PREFIX}${MAJOR}-${DATE}\.?//; s/^$/0/" <<< "${EXISTING}" | sort -n | tail -1)
            N=$((LAST + 1))
            TAG="${TAG_PREFIX}${MAJOR}-${DATE}.${N}"
            VERSION="${MAJOR}.${DATE}.${N}"
          fi
          echo "Version ${VERSION} (tag ${TAG})"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          BASE_IMAGE: ${{ needs.check-base.outputs.base_image }}
          BASE_IMAGE_DIGEST: ${{ needs.check-base.outputs.base_digest }}
        run: |
          # Build from the exact base digest check-base saw, not the moving tag
          buildah build \
            --build-arg BASE_IMAGE="${BASE_IMAGE}@${BASE_IMAGE_DIGEST}" \
            --build-arg BASE_IMAGE_DIGEST="${BASE_IMAGE_DIGEST}" \
            --build-arg AERINITE_VERSION="${{ steps.version.outputs.version }}" \
            --tag raw-img .

      # Rechunking drops the image config, so collect every label the final
      # image needs: the build's own labels (base image name/digest), minus
      # stale ostree ones, overridden by ours.
      - name: Collect labels
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          KERNEL=$(podman run --rm raw-img rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel-core | tail -1)
          podman image inspect raw-img | jq -r --arg kernel "${KERNEL}" \
            --arg version "${VERSION}" \
            --arg created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg desc "${IMAGE_DESC}" \
            --arg title "${IMAGE_NAME}" \
            --arg repo "https://github.com/${{ github.repository }}" \
            --arg sha "${{ github.sha }}" \
            --arg vendor "${{ github.repository_owner }}" \
            --arg base "${{ needs.check-base.outputs.base_image }}" '
              (.[0].Labels // {})
              | with_entries(select((.key | IN("ostree.commit", "ostree.final-diffid",
                  "rpmostree.inputhash", "io.buildah.version", "quay.expires-after"))
                  or (.key | startswith("io.artifacthub.")) | not))
              + {
                  "containers.bootc": "1",
                  "org.opencontainers.image.base.name": $base,
                  "ostree.bootable": "true",
                  "ostree.linux": $kernel,
                  "org.opencontainers.image.created": $created,
                  "org.opencontainers.image.description": $desc,
                  "org.opencontainers.image.documentation": ($repo + "/blob/" + $sha + "/README.md"),
                  "org.opencontainers.image.revision": $sha,
                  "org.opencontainers.image.source": ($repo + "/blob/" + $sha + "/Containerfile"),
                  "org.opencontainers.image.title": $title,
                  "org.opencontainers.image.url": $repo,
                  "org.opencontainers.image.vendor": $vendor,
                  "org.opencontainers.image.version": $version
                }
              | to_entries[] | "\(.key)=\(.value)"' > "${RUNNER_TEMP}/labels.txt"
          cat "${RUNNER_TEMP}/labels.txt"

      # Split the image into package-grouped layers so updates only download
      # what changed (#12). Uses rpm-ostree from the built image itself, and the
      # previous published build as the layout reference so unchanged chunks
      # keep their digests; falls back to a fresh layout if that isn't usable.
      - name: Rechunk
        run: |
          set -euo pipefail
          buildah unshare bash -euo pipefail -c '
            container=$(buildah from raw-img)
            mnt=$(buildah mount "$container")
            rm -rf "$mnt"/run/.* "$mnt"/run/* "$mnt"/tmp/.* "$mnt"/tmp/* 2>/dev/null || true
            buildah umount "$container"
            buildah commit --identity-label=false --rm "$container" raw-img
          '

          RECHUNK_DIR="$(mktemp -d "${RUNNER_TEMP}/rechunk-XXXXXX")"
          label_args=()
          while IFS= read -r line; do
            [ -n "$line" ] && label_args+=(--label "$line")
          done < "${RUNNER_TEMP}/labels.txt"

          chunk() {
            podman run --rm --pull=never --privileged \
              --mount=type=image,src=localhost/raw-img,target=/rpm-ostree \
              --volume "${RECHUNK_DIR}:/run/out:Z" \
              --entrypoint /usr/bin/rpm-ostree \
              localhost/raw-img \
              compose build-chunked-oci \
              --bootc --max-layers 127 --format-version 2 \
              "${label_args[@]}" "$@" \
              --rootfs /rpm-ostree --output oci-archive:/run/out/chunked.oci
          }
          PREVIOUS="docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          if ! chunk --previous-build "${PREVIOUS}"; then
            echo "::warning::Rechunking against ${PREVIOUS} failed; using a fresh layout"
            rm -f "${RECHUNK_DIR}/chunked.oci"
            chunk
          fi

          podman rmi -f localhost/raw-img
          chunked=$(podman pull -q "oci-archive:${RECHUNK_DIR}/chunked.oci")
          podman tag "${chunked}" localhost/chunked-img
          rm -rf "${RECHUNK_DIR}"

          podman image inspect localhost/chunked-img | jq -r '
            "Layers: \(.[0].RootFS.Layers | length)",
            "containers.bootc=\(.[0].Labels["containers.bootc"])",
            "ostree.linux=\(.[0].Labels["ostree.linux"])",
            "version=\(.[0].Labels["org.opencontainers.image.version"])"'
          [ "$(podman image inspect localhost/chunked-img | jq -r '.[0].Labels["containers.bootc"]')" = 1 ]

      # Push the build tag, sign its digest, and only then point the alias tags
      # at it: latest must never name an unsigned image, since installs enforce
      # signatures and would refuse the update.
      - name: Push to GHCR
        id: push
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          for attempt in 1 2 3; do
            podman push --digestfile=/tmp/digestfile localhost/chunked-img "docker://${IMAGE}:${TAG}" && break
            [ "${attempt}" = 3 ] && exit 1
            sleep 15
          done
          DIGEST="$(< /tmp/digestfile)"
          [ -n "${DIGEST}" ] || { echo "push wrote no digest"; exit 1; }
          echo "Pushed ${IMAGE}:${TAG} @ ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && env.HAS_SIGNING_KEY == 'true'
        with:
          cosign-release: 'v2.6.1'

      # One signature on the pushed digest covers every tag pointing at it.
      - name: Sign container image
        if: github.event_name != 'pull_request' && env.HAS_SIGNING_KEY == 'true'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PASSWORD: ""
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"

      # --preserve-digests fails rather than re-encode the manifest into a
      # digest the signature doesn't cover.
      - name: Tag aliases
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          MAJOR: ${{ needs.check-base.outputs.fedora_major }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          ALIASES=("${DEFAULT_TAG}")
          [ "${CHANNEL}" = stable ] && ALIASES+=("${MAJOR}")
          for alias in "${ALIASES[@]}"; do
            skopeo copy --preserve-digests "docker://${IMAGE}@${DIGEST}" "docker://${IMAGE}:${alias}"
          done
          echo "Tagged ${ALIASES[*]} @ ${DIGEST}"

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BASE_IMAGE: ${{ needs.check-base.outputs.base_image }}
          BASE_VERSION: ${{ needs.check-base.outputs.base_version }}
          BASE_DIGEST: ${{ needs.check-base.outputs.base_digest }}
          BASE_KERNEL: ${{ needs.check-base.outputs.base_kernel }}
        run: |
          # Previous release in the same channel
          if [ "${CHANNEL}" = beta ]; then
            PREV=$(git describe --tags --abbrev=0 --match 'beta-*' HEAD 2>/dev/null || true)
            RELEASE_ARGS=(--prerelease --latest=false)
          else
            PREV=$(git describe --tags --abbrev=0 --exclude 'beta-*' HEAD 2>/dev/null || true)
            RELEASE_ARGS=()
          fi
          {
            echo "## Changes"
            echo
            if [ -z "${PREV}" ]; then
              echo "First versioned release. Recent commits:"
              echo
              git log --no-merges --format='- %h %s' -n 20 HEAD
            elif [ -z "$(git rev-list "${PREV}..HEAD")" ]; then
              echo "No repository changes since ${PREV}; rebuilt for base image updates."
            else
              echo "Since ${PREV}:"
              echo
              git log --no-merges --format='- %h %s' "${PREV}..HEAD"
            fi
            echo
            echo "## Base"
            echo
            echo "- Image: \`${BASE_IMAGE}\` (${BASE_VERSION})"
            echo "- Digest: \`${BASE_DIGEST}\`"
            echo "- Kernel: \`${BASE_KERNEL}\`"
            echo
            echo "## Install"
            echo
            echo "\`ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${TAG}\`"
          } > notes.md
          cat notes.md
          gh release create "${TAG}" --target "${GITHUB_SHA}" --title "${VERSION}" --notes-file notes.md "${RELEASE_ARGS[@]}"
