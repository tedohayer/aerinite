# Noctalia Greeter defaults: preselect niri, password login (it unlocks the
# keyring), 12h clock, colors synced from Noctalia (Aerinite until the first
# sync, see /usr/share/aerinite/greeter-sync.toml).

[session]
default = "Niri"

[auth]
allow_empty_password = false

[clock]
time_format = "{:%I:%M %p}"

[appearance]
scheme = "Synced"
