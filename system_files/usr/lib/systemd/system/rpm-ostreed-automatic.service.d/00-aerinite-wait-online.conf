# A timer that elapsed during suspend fires right at resume, before Wi-Fi is
# back. base-main's metered check (override.conf) then fails and the update is
# skipped until the next scheduled run. Wait for a connection first; this file
# sorts before override.conf, so its condition runs first.
[Service]
ExecCondition=/usr/bin/nm-online -q -t 300
TimeoutStartSec=6min
