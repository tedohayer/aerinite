# The greeter reads its state from /var, which images don't ship; create it
# at boot, link in the image's greeter.toml and seed sync.toml with the
# Aerinite palette (C skips it once Sync has written one). Z restores the
# SELinux label (see build.sh) on directories created before it existed.
d /var/lib/noctalia-greeter 0750 greetd greetd -
Z /var/lib/noctalia-greeter - - - -
L+ /var/lib/noctalia-greeter/greeter.toml - - - - /etc/noctalia-greeter/greeter.toml
C /var/lib/noctalia-greeter/sync.toml 0644 greetd greetd - /usr/share/aerinite/greeter-sync.toml
