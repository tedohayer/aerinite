# Noctalia has no system-wide config dir, but merges every *.toml in the
# user's config dir, so link the image defaults and the Aerinite palette in at
# login. L+ repoints the links if the image paths change;
# ~/.config/noctalia/config.toml overrides the defaults.
d %h/.config/noctalia 0755 - - -
L+ %h/.config/noctalia/00-image.toml - - - - /usr/share/aerinite/noctalia.toml
d %h/.config/noctalia/palettes 0755 - - -
L+ %h/.config/noctalia/palettes/Aerinite.json - - - - /usr/share/aerinite/noctalia-palette.json
