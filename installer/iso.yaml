# ISO volume label and GRUB menu for the Aerinite installer (image-builder
# bootc-generic-iso). inst.stage2 must match the label.
label: "Aerinite-Installer"
grub2:
  entries:
    - name: "Install Aerinite"
      linux: "/images/pxeboot/vmlinuz inst.stage2=hd:LABEL=Aerinite-Installer console=tty0 inst.graphical selinux=0 rhgb quiet"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Install Aerinite (basic graphics)"
      linux: "/images/pxeboot/vmlinuz inst.stage2=hd:LABEL=Aerinite-Installer console=tty0 inst.graphical nomodeset selinux=0 quiet"
      initrd: "/images/pxeboot/initrd.img"
