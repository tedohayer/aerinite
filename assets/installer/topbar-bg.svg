<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="132" viewBox="0 0 1040 132">
  <title>aerinite installer top bar background</title>
  <!-- Tiled (background-repeat: repeat) behind the spoke nav bar, so it is
       uniform horizontally. The bar is normally shorter than 132px. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c222b"/>
      <stop offset="1" stop-color="#151a21"/>
    </linearGradient>
  </defs>
  <rect width="1040" height="132" fill="url(#base)"/>
</svg>
